name: relay-cron

# Vercel is serverless — these run here instead. Hourly:
#   /renew  keeps the Workspace Events subscription alive
#   /sync   provisions spaces for new COMPLETED rows in the Leegality sheet
#           (idempotent: skips phones that already have a space, cap 15/run)
#
# Secrets (repo Settings -> Secrets and variables -> Actions):
#   RELAY_URL        e.g. https://googlechat-whatapp.vercel.app   (no trailing slash)
#   PROVISION_TOKEN  same value as the app's PROVISION_TOKEN env var

on:
  schedule:
    - cron: "23 * * * *" # hourly (:23 UTC — off the top-of-hour rush GitHub throttles)
  workflow_dispatch: {}

jobs:
  cron:
    runs-on: ubuntu-latest
    steps:
      - name: Renew Workspace Events subscription
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          PROVISION_TOKEN: ${{ secrets.PROVISION_TOKEN }}
        run: |
          URL="$(printf '%s' "$RELAY_URL" | tr -d '[:space:]')"; URL="${URL%/}"
          TOK="$(printf '%s' "$PROVISION_TOKEN" | tr -d '[:space:]')"
          echo "renew:"; curl -fsS --retry 3 -X POST "$URL/renew" -H "x-provision-token: $TOK"; echo

      - name: Sync the Leegality sheet
        if: always() # run even if renew failed
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          PROVISION_TOKEN: ${{ secrets.PROVISION_TOKEN }}
        run: |
          URL="$(printf '%s' "$RELAY_URL" | tr -d '[:space:]')"; URL="${URL%/}"
          TOK="$(printf '%s' "$PROVISION_TOKEN" | tr -d '[:space:]')"
          echo "sync:"; curl -fsS --retry 3 -X POST "$URL/sync" -H "x-provision-token: $TOK"; echo
